name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30 was not enough: the first full run was CANCELLED at 30m27s with E2E
    # still going. Everything before it (typecheck, lint, 331 unit+integration,
    # build, budgets) finishes in ~12 min; the e2e job runs ~90 tests across
    # FOUR engines and CI forces workers:1, so it needs most of the rest.
    #
    # Raised rather than sharded per browser on purpose. A matrix job per engine
    # would be faster, but the project-coverage reporter (WO-3) disables itself
    # when only one project is configured — so sharding would silently switch
    # off the very guard that exists to catch a missing engine (D-55). One job
    # keeps that check meaningful.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`, and this is a deliberate trade.
      #
      # `npm ci` fails here on a lockfile that is perfectly valid locally:
      # `@tailwindcss/oxide-wasm32-wasi` (Tailwind's WASM fallback) records its
      # `@emnapi/*` transitive deps at positions that differ between platforms,
      # so a lock generated on Windows cannot satisfy a clean install on Linux.
      # Regenerating it on Windows just inverts the problem — the two runs
      # demanded HOISTED and NESTED positions respectively, at different
      # versions. It is a known npm issue with that package, not a real
      # dependency mismatch.
      #
      # Cost accepted: `npm install` may resolve a newer in-range version than
      # the lock pins, so CI is not byte-identical to a local install. For a
      # solo project with no reproducible-build requirement that is a smaller
      # problem than a permanently red pipeline. Revisit if the lockfile ever
      # needs to be authoritative — the fix then is to generate it on Linux.
      - run: npm install --no-audit --no-fund

      # NOT optional (WO-3, docs/12 D-55). Four browser projects are configured;
      # for months only Chromium's binary was installed locally, so the suite
      # reported a passing summary while three engines never launched. The
      # project-coverage reporter now fails a run with a missing engine, and
      # this step is what stops that failure from being the normal state in CI.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ONE COMMAND, not seven steps, and the reason is drift.
      #
      # This job used to list every gate itself: typecheck, lint, unit,
      # integration, build, budgets. `scripts/verify.mjs` lists the same gates
      # plus `check:seo`, and the two had already diverged — SEO was checked
      # locally and not here. Two copies of a gate list is the same failure that
      # produced D-96 and D-98, where a flag existed in one file and not in the
      # one actually running.
      #
      # `--fast` skips only the e2e gate, which the next step runs properly across
      # all four engines. verify names the failing gate in its own output, so
      # attribution survives collapsing the steps.
      - name: Verify (lint, types, unit, build, budgets, seo, integration)
        run: node scripts/verify.mjs --fast

      # Full e2e across all four engines — deliberately BROADER than the local
      # verify, which runs chromium only so a pre-commit check stays under four
      # minutes. Two of this project's real defects were engine-specific and
      # invisible to chromium: D-94 (every PDF thumbnail was a grey box on
      # Safari, because WebKit has no OffscreenCanvas) and D-74. The privacy
      # suite in here is the product's core claim expressed as code — a failure
      # is a release blocker.
      - name: E2E (chromium, firefox, webkit, mobile-safari)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
